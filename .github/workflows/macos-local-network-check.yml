# TEMPORARY — verification for #71. Remove before merging.
# Builds the macOS bundle, asserts NSLocalNetworkUsageDescription made it into
# the app's Info.plist, and uploads the .dmg for testing on a real Mac.
name: macOS Local Network check (#71)

on:
  push:
    branches:
      - fix/macos-local-network-permission

jobs:
  macos-bundle:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests (macOS)
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build universal app + dmg
        run: bun run tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Assert NSLocalNetworkUsageDescription is in the bundle
        run: |
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/Termimus.app
          /usr/libexec/PlistBuddy -c "Print :NSLocalNetworkUsageDescription" "$APP/Contents/Info.plist"
          codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier|TeamIdentifier" || true

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: termimus-macos-universal-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 14
