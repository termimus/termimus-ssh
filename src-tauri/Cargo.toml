[package]
name = "termimus"
version = "0.9.0"
description = "Termimus - Self-hosted SSH & Server Manager"
authors = ["noma"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "termimus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = "0.65"
rusqlite = { version = "0.41", features = ["bundled"] }
aes-gcm = "0.10"
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
# rand 0.10 is required by russh 0.65 / ssh-key 0.7 (rand_core 0.10) for key generation.
rand_10 = { package = "rand", version = "0.10" }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
zeroize = { version = "1", features = ["derive"] }
keyring = { version = "4", features = ["default"] }
russh-sftp = "3.0.1"
anyhow = "1.0.104"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2.4.0"
portable-pty = "0.8"
socket2 = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
regex = "1.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows Hello (UserConsentVerifier) via WinRT. Only the Security_Credentials_UI
# API surface plus the WinRT apartment initialiser are enabled.
windows = { version = "0.62", features = [
    "Security_Credentials_UI",
    "Foundation",
    "Win32_System_WinRT",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
